[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-booking-ml"
version = "0.1.0"
description = "Reproducible machine-learning project for City Hotel booking demand."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hotel-booking = "hotel_booking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

# These two modules emit long markdown/HTML template lines (prose artifacts);
# code lines stay within the limit.
[tool.ruff.lint.per-file-ignores]
"src/hotel_booking/data/adr_evidence.py" = ["E501"]
"src/hotel_booking/reporting/report.py" = ["E501"]
